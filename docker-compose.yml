name: dsh-code-review

services:
  reviewd:
    build:
      context: .
      args:
        VERSION: ${CODE_REVIEW_VERSION:-0.2.0}
    image: ${CODE_REVIEW_IMAGE:-dsh-code-review:local}
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - '127.0.0.1:${CODE_REVIEW_PORT:-3100}:3100'
    env_file:
      - path: .env
        required: false
    environment:
      CODE_REVIEW_TOKEN: ${CODE_REVIEW_TOKEN:?set CODE_REVIEW_TOKEN in .env (32+ random bytes)}
      CODE_REVIEW_STORE: /data
      CODE_REVIEW_PUBLIC_URL: ${CODE_REVIEW_PUBLIC_URL:-http://127.0.0.1:3100}
      CODE_REVIEW_HOST: 0.0.0.0
      CODE_REVIEW_PORT: '3100'
    volumes:
      - review-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  review-data:
